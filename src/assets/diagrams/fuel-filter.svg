<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d">
<title id="t">Diesel fuel filter: guide drawing</title>
<desc id="d">Diesel fuel system: tank, the fuel filter and water separator with its priming pump and water drain, the high-pressure pump, the common rail and the injectors.</desc>
