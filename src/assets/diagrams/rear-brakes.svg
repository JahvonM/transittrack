<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d">
<title id="t">Rear drum brake: guide drawing</title>
<desc id="d">Backing plate with the drum taken off: two brake shoes with linings, the wheel cylinder at the top, return springs, the adjuster at the bottom and the handbrake cable.</desc>
<style>
