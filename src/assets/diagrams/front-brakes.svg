<text class="s" x="24" y="72">Guide drawing: not to scale, not from Toyota or Nissan diagrams</text>
<circle class="b" cx="300" cy="370" r="190"/>
<circle cx="300" cy="370" r="150" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 8"/>
<circle class="m" cx="300" cy="370" r="85"/><circle class="k" cx="300" cy="318" r="10"/><circle class="k" cx="349.5" cy="353.9" r="10"/><circle class="k" cx="330.6" cy="412.1" r="10"/><circle class="k" cx="269.4" cy="412.1" r="10"/><circle class="k" cx="250.5" cy="353.9" r="10"/><circle cx="300" cy="370" r="22" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
<rect class="d" x="425" y="255" width="110" height="230" rx="28"/>
<rect class="a" x="470" y="290" width="22" height="160" rx="6"/>
<circle class="k" cx="535" cy="285" r="9"/><circle class="k" cx="535" cy="455" r="9"/>
<circle class="k" cx="508" cy="268" r="9"/>
