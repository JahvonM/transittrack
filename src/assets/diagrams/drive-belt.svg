<circle class="d" cx="470" cy="330" r="26"/>
<path d="M400,540 C 360,540 335,520 333,490 L 245,455 C 215,470 160,460 151,420 C 145,385 165,365 190,372 L 197,232 C 190,200 210,158 245,156 C 270,156 290,180 286,205 L 360,215 C 380,205 420,205 440,215 L 525,205 C 545,185 590,190 600,225 C 605,255 585,272 560,270 L 495,322 C 497,345 480,357 465,355 L 468,455 C 478,500 445,540 400,540 Z" fill="none" stroke="#0e7490" stroke-width="10" stroke-linejoin="round"/>
