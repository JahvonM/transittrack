# Puts McSween Transport's sign-in emails on Supabase (step 7 of the move from
# Base44): the sign-up code, password reset and invitation emails built by
# tools/supabase/auth-emails.mjs. Runs whenever that file changes on main.
#
# Uses the SUPABASE_ACCESS_TOKEN repository secret the functions deploy already
# uses. Add a RESEND_API_KEY repository secret as well and the emails go out
# through Resend from no-reply@mcsweenstransport.com, to everyone (Supabase's
# built-in email only reaches the project's team members).
name: Supabase sign-in emails

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'tools/supabase/auth-emails.mjs'
      - '.github/workflows/supabase-auth-emails.yml'
  workflow_dispatch:

concurrency:
  group: supabase-auth-emails
  cancel-in-progress: false

jobs:
  emails:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # The address the emails come from (its domain is verified in Resend).
      EMAIL_FROM: no-reply@mcsweenstransport.com
      PROJECT_REF: ghqpznxqngvhmkiwcauj
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The emails build and pass their checks
        run: node tools/supabase/auth-emails.mjs --check
      - name: Put the emails on Supabase
        run: node tools/supabase/auth-emails.mjs --push
