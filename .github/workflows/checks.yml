# Runs on every change pushed to GitHub (including edits made in Base44,
# which sync to this repo) and on every pull request:
#   lint  - catches mistakes like unused or missing imports
#   test  - the unit tests in src/lib/__tests__
#   build - makes sure the app still builds
name: Checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Mocked browser regression tests
        run: npm run test:e2e

  security-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # These assertions intentionally stay red until known release blockers are fixed.
      # Never convert them to skips/expected failures or use continue-on-error.
      - name: Production security requirements
        run: npm run test:security:release
