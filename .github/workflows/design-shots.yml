# Temporary: screenshots of design branches, pushed to ci-shots/<branch> for
# review. Not part of the normal checks.
name: Design screenshots
on:
  push:
    branches: ['design/**']
permissions:
  contents: write
concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.shots.config.js
        continue-on-error: true
      - run: mkdir -p shots/tour && TT_SHOT_DIR=shots/tour npx playwright test e2e/admin-fast-open.spec.js -g "admin console tour"
        continue-on-error: true
      - name: Publish the screenshots
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q && git checkout -q -b shots
          git config user.name "design-shots" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA}"
          target="ci-shots/${GITHUB_REF_NAME//\//-}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "shots:refs/heads/${target}"
