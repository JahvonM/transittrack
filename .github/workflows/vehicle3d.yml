name: Bus 360 viewer checks

on:
  pull_request:
    paths:
      - 'src/components/vehicle3d/**'
      - 'src/lib/vehicle360*'
      - 'src/lib/vehicle3d*'
      - 'src/pages/VehicleDetail.jsx'
      - 'src/pages/VehicleRegistry.jsx'
      - 'supabase/functions/vehicle3d/**'
      - '.github/workflows/vehicle3d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: 360 viewer validation and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run src/lib/vehicle360.test.js src/lib/vehicle3dCapture.test.js
      - run: npm run build:supabase
