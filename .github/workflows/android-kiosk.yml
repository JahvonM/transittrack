name: Android kiosk
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-kiosk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run build:supabase
      - run: npx cap sync android
      - name: Compile combined kiosk and run native unit tests
        run: bash android/gradlew -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-kiosk-test-results
          path: android/app/build/reports/tests/
