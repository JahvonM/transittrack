name: Android kiosk
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-kiosk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run build:supabase
      - run: npx cap sync android
      - name: Compile combined kiosk and run native unit tests
        run: bash android/gradlew -p android :app:assembleKioskDebug :app:testKioskDebugUnitTest --no-daemon
      # The store app (McSween Driver) is built from the same code: make sure
      # a kiosk change never breaks it. Its own checks are in store-app.yml.
      - name: Compile the store app
        run: bash android/gradlew -p android :app:assembleStoreDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-kiosk-test-results
          path: android/app/build/reports/tests/
