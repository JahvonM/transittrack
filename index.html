<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D1520" />
    <style>html.dark, html:not(.light) { background: #0D1520; } html.light { background: #ffffff; }</style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tt-theme-v2");
          if (t !== "dark" && t !== "light") t = "dark";
          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.add(t);
          var a = localStorage.getItem("tt-accent");
          if (a) root.setAttribute("data-accent", a);
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="TransitTrack" />
    <meta name="application-name" content="TransitTrack" />
    <meta
      name="description"
      content="TransitTrack connects bus and taxi fleets with their passengers: live vehicle tracking, arrival times, boarding, inspections and fleet management in one place."
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TransitTrack" />
    <meta property="og:title" content="TransitTrack" />
    <meta
      property="og:description"
      content="Live fleet tracking, bus boarding and driver tools for bus and taxi operators."
    />
    <meta property="og:url" content="https://eager-transit-track-go.base44.app/" />
    <meta property="og:image" content="https://eager-transit-track-go.base44.app/brand/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TransitTrack" />
    <meta
      name="twitter:description"
      content="Live fleet tracking, bus boarding and driver tools for bus and taxi operators."
    />
    <meta name="twitter:image" content="https://eager-transit-track-go.base44.app/brand/icon-512.png" />
    <title>TransitTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
