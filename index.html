<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/brand/favicon.ico?v=mcsween1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=mcsween1" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=mcsween1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest?v=mcsween1" />
    <meta name="theme-color" content="#0D1520" />
    <style>html.dark, html:not(.light) { background: #0D1520; } html.light { background: #ffffff; }</style>
    <script>
      // The app moved off Base44: its old address sends people to the same
      // page on app.mcsweenstransport.com (docs/SWITCH-TO-SUPABASE.md, step 9).
      if (location.hostname === "eager-transit-track-go.base44.app") {
        location.replace("https://app.mcsweenstransport.com" + location.pathname + location.search + location.hash);
      }
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tt-theme-v2");
          var chosen = !!t;
          if (t !== "dark" && t !== "light") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.add(t);
          // Someone picked a mode in Account -> Appearance (the admin console
          // stays dark until they do).
          if (chosen) root.classList.add("tt-theme-chosen");
          root.style.colorScheme = t;
          var a = localStorage.getItem("tt-accent");
          if (a) root.setAttribute("data-accent", a);
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="McSween" />
    <meta name="application-name" content="McSween Transport" />
    <meta
      name="description"
      content="McSween Transport: airport pickups and drop-offs, transfers, island tours and staff transport in Grenada. Request a ride online and track your bus."
    />
